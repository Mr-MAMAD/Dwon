name: phub2 Downloader (Find Video)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Page URLs (space or newline separated)'
        required: true
        default: 'https://vidara.so/v/cpbnwULfofbCA'
        type: string
      quality:
        description: 'Preferred quality (height), e.g. 240 / 480 / 720'
        required: true
        default: '480'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          mkdir -p downloads
          cat > package.json << 'EOF'
          {
            "name": "grab",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "playwright": "1.48.2" }
          }
          EOF
          which ffmpeg ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Cache Playwright and node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: pw-1.48.2-${{ runner.os }}

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Write script
        shell: bash
        run: |
          cat > grab.js << 'EOF'
          const { chromium } = require('playwright');
          const { spawnSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const FILE_RE = /\.(mp4|webm|mkv|mov|m4v|vid)(\?|#|$)/i;
          const HLS_RE = /\.m3u8(\?|#|$)/i;
          const AD_RE = /(doubleclick|googlesyndication|googleads|exoclick|exosrv|adsco|adserver|adsystem|adnxs|popads|popcash|propeller|juicyads|trafficjunky|vast|vpaid|\/ads?\/|[\/_.-]ads?[\/_.-]|advert|banner|preroll|pre-roll|promo|sponsor|clickadu|hilltopads|adcash|ero-advertising|tsyndicate|syndication)/i;
          const urls = (process.env.URLS || '').split(/\s+/).filter(u => /^https?:\/\//.test(u));
          const QUALITY = parseInt(process.env.QUALITY || '480', 10) || 480;
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';
          const MIN_SIZE = 102400;
          const BIG_SIZE = 20 * 1024 * 1024;

          console.log('Target quality:', QUALITY + 'p');

          function pageId(u, i) {
            try { return path.basename(new URL(u).pathname) || `video_${i}`; }
            catch (e) { return `video_${i}`; }
          }

          function fileNameFrom(u, i, k) {
            try {
              const n = path.basename(new URL(u).pathname);
              if (n && FILE_RE.test(n)) return n;
            } catch (e) {}
            return `video_${i}_${k}.mp4`;
          }

          function hostOf(u) { try { return new URL(u).hostname; } catch (e) { return ''; } }

          function headersFor(referer) {
            const origin = new URL(referer).origin;
            return `Referer: ${referer}\r\nOrigin: ${origin}\r\n`;
          }

          function qualityFromUrl(u) {
            let name = '';
            try { name = decodeURIComponent(path.basename(new URL(u).pathname)); } catch (e) { name = u; }
            // 480P_1000K_123.mp4  یا  480p_...
            let m = name.match(/^(\d{3,4})p[_\-.]/i);
            if (m) return parseInt(m[1], 10);
            // ..._480p_... یا ..._480P.
            m = name.match(/[_\-.](\d{3,4})p(?:[_\-.]|$)/i);
            if (m) return parseInt(m[1], 10);
            // مسیر مثل /480p/ یا /480/
            m = u.match(/(?:^|[\/_.\-=])(144|240|360|480|540|720|1080|1440|2160)p?(?:[\/_.\-?&]|$)/i);
            return m ? parseInt(m[1], 10) : 0;
          }

          async function fetchText(ctx, url, referer) {
            try {
              const r = await ctx.request.get(url, { headers: { Referer: referer, Accept: '*/*' }, timeout: 30000 });
              if (!r.ok()) return '';
              return await r.text();
            } catch (e) { return ''; }
          }

          function parseMaster(text, base) {
            const lines = text.split(/\r?\n/);
            const audios = {};
            lines.forEach(l => {
              if (l.startsWith('#EXT-X-MEDIA') && /TYPE=AUDIO/.test(l)) {
                const g = (l.match(/GROUP-ID="([^"]+)"/) || [])[1];
                const u = (l.match(/URI="([^"]+)"/) || [])[1];
                if (g && u) { try { audios[g] = new URL(u, base).href; } catch (e) {} }
              }
            });
            const vars = [];
            for (let n = 0; n < lines.length; n++) {
              const l = lines[n];
              if (!l.startsWith('#EXT-X-STREAM-INF')) continue;
              const res = l.match(/RESOLUTION=(\d+)x(\d+)/);
              const ag = (l.match(/AUDIO="([^"]+)"/) || [])[1];
              let m = n + 1;
              while (m < lines.length && (!lines[m].trim() || lines[m].startsWith('#'))) m++;
              if (m >= lines.length) continue;
              try {
                const vurl = new URL(lines[m].trim(), base).href;
                const height = res ? Math.min(parseInt(res[1], 10), parseInt(res[2], 10)) : qualityFromUrl(vurl);
                vars.push({ url: vurl, height, audio: ag ? (audios[ag] || null) : null });
              } catch (e) {}
            }
            return vars;
          }

          function probeMedia(url, referer) {
            try {
              const r = spawnSync('ffprobe', [
                '-v', 'error', '-user_agent', UA, '-headers', headersFor(referer),
                '-select_streams', 'v:0',
                '-show_entries', 'stream=height:format=duration',
                '-of', 'json', url
              ], { encoding: 'utf8', timeout: 60000 });
              const j = JSON.parse(r.stdout || '{}');
              const height = j.streams && j.streams[0] ? parseInt(j.streams[0].height, 10) || 0 : 0;
              const dur = j.format ? parseFloat(j.format.duration) || 0 : 0;
              return { height, dur };
            } catch (e) { return { height: 0, dur: 0 }; }
          }

          async function probeSize(ctx, url, referer) {
            try {
              const r = await ctx.request.get(url, {
                headers: { Referer: referer, Range: 'bytes=0-0', Accept: '*/*' },
                maxRedirects: 10, timeout: 20000
              });
              const cr = r.headers()['content-range'];
              if (cr && /\/(\d+)$/.test(cr)) return parseInt(cr.match(/\/(\d+)$/)[1], 10);
              const cl = r.headers()['content-length'];
              if (cl && r.status() === 200) return parseInt(cl, 10);
            } catch (e) {}
            return 0;
          }

          async function downloadDirect(ctx, url, referer, out) {
            try { fs.unlinkSync(out); } catch (e) {}
            const res = await ctx.request.get(url, {
              headers: { Referer: referer, Accept: '*/*' },
              maxRedirects: 10, timeout: 1800000
            });
            console.log('  Final URL:', res.url());
            console.log('  Status:', res.status());
            if (!res.ok()) return false;
            const body = await res.body();
            if (body.length < MIN_SIZE) { console.log('  Too small:', body.length); return false; }
            fs.writeFileSync(out, body);
            console.log(`  OK: ${out} (${body.length} bytes)`);
            return true;
          }

          function downloadHls(url, audio, referer, out) {
            try { fs.unlinkSync(out); } catch (e) {}
            const h = headersFor(referer);
            const args = ['-y', '-loglevel', 'error', '-user_agent', UA, '-headers', h, '-i', url];
            if (audio) args.push('-user_agent', UA, '-headers', h, '-i', audio, '-map', '0:v:0', '-map', '1:a:0');
            args.push('-c', 'copy', '-bsf:a', 'aac_adtstoasc', out);
            const r = spawnSync('ffmpeg', args, { stdio: 'inherit' });
            const exists = fs.existsSync(out);
            const size = exists ? fs.statSync(out).size : 0;
            if (r.status !== 0 || size < MIN_SIZE) {
              console.log('  HLS failed or too small:', size);
              if (exists) fs.unlinkSync(out);
              return false;
            }
            console.log(`  OK: ${out} (${size} bytes)`);
            return true;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--autoplay-policy=no-user-gesture-required', '--no-sandbox', '--disable-blink-features=AutomationControlled']
            });
            let success = 0;

            for (let i = 0; i < urls.length; i++) {
              const pageUrl = urls[i];
              const pageHost = hostOf(pageUrl);
              console.log(`\n[${i + 1}] ${pageUrl}`);
              const ctx = await browser.newContext({
                userAgent: UA,
                viewport: { width: 1280, height: 720 },
                locale: 'en-US'
              });
              await ctx.addInitScript(() => {
                Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              });

              try {
                const cands = new Map();
                let order = 0;

                const add = (u, why) => {
                  if (!u || !/^https?:/i.test(u)) return;
                  const clean = u.replace(/#\.mp4$/, '');
                  if (cands.has(clean)) return;
                  let type = null;
                  if (HLS_RE.test(clean)) type = 'hls';
                  else if (FILE_RE.test(clean) || why === 'content-type') type = 'file';
                  if (!type) return;
                  cands.set(clean, { type, why, order: order++ });
                  console.log(`  Found ${type} (${why}):`, clean);
                };

                const page = await ctx.newPage();

                ctx.on('page', async p => {
                  if (p === page) return;
                  await p.waitForTimeout(1000).catch(() => {});
                  console.log('  Closing popup:', p.url());
                  await p.close().catch(() => {});
                });

                page.on('request', r => add(r.url(), 'request'));
                page.on('response', r => {
                  const ct = (r.headers()['content-type'] || '').toLowerCase();
                  if (ct.startsWith('video/')) add(r.url(), 'content-type');
                  if (ct.includes('mpegurl')) add(r.url(), 'content-type');
                });

                const resp = await page.goto(pageUrl, { waitUntil: 'load', timeout: 90000 }).catch(e => { console.log('  goto error:', e.message); return null; });
                console.log('  Page status:', resp ? resp.status() : 'none');
                console.log('  Final page URL:', page.url());
                console.log('  Title:', await page.title().catch(() => '?'));
                await page.waitForTimeout(4000);

                const readFromDom = async () => {
                  for (const frame of page.frames()) {
                    try {
                      const base = frame.url() || pageUrl;
                      const vals = await frame.evaluate(() => {
                        const out = [];
                        document.querySelectorAll('video, video source, source').forEach(v => {
                          out.push(v.getAttribute('src'));
                          out.push(v.currentSrc);
                        });
                        document.querySelectorAll('meta[itemprop="contentUrl"], meta[property="og:video"], meta[property="og:video:url"]').forEach(m => out.push(m.content));
                        document.querySelectorAll('a[download]').forEach(a => out.push(a.href));
                        return out.filter(Boolean);
                      });
                      vals.forEach(s => { try { add(new URL(s, base).href, 'dom'); } catch (e) {} });
                    } catch (e) {}
                  }
                };

                const tryPlay = async () => {
                  for (const frame of page.frames()) {
                    try {
                      await frame.evaluate(() => {
                        document.querySelectorAll('video').forEach(v => { v.muted = true; v.play().catch(() => {}); });
                      });
                      for (const sel of ['.vjs-big-play-button', '.jw-icon-display', '.plyr__control--overlaid', '.play-button', '.play', '[class*="play" i]', 'video']) {
                        const el = await frame.$(sel);
                        if (el) await el.click({ timeout: 1500, force: true }).catch(() => {});
                      }
                    } catch (e) {}
                  }
                  await page.mouse.click(640, 360).catch(() => {});
                };

                const trySkipAd = async () => {
                  const sels = [
                    '.videoAdUiSkipButton', '.ytp-ad-skip-button', '.jw-skip', '.jw-skiplink',
                    '.vjs-skip-button', '.skip-button', '.skip_button', '#skip', '.ad-skip', '.adskip',
                    '[class*="skip" i]', '[id*="skip" i]'
                  ];
                  for (const frame of page.frames()) {
                    for (const s of sels) {
                      try {
                        const el = await frame.$(s);
                        if (el && await el.isVisible().catch(() => false)) {
                          console.log('  Clicking skip:', s);
                          await el.click({ timeout: 1500, force: true }).catch(() => {});
                        }
                      } catch (e) {}
                    }
                    try {
                      const byText = frame.getByText(/skip( ad)?|close ad|رد کردن/i).first();
                      if (await byText.isVisible({ timeout: 300 }).catch(() => false)) {
                        console.log('  Clicking skip (text)');
                        await byText.click({ timeout: 1500, force: true }).catch(() => {});
                      }
                    } catch (e) {}
                  }
                };

                const trySelectQuality = async () => {
                  const menuSels = [
                    '.jw-icon-settings', '.jw-settings-quality', '.vjs-menu-button', '.vjs-quality-selector',
                    '.plyr__control[data-plyr="settings"]', '[class*="quality" i]', '[class*="setting" i]',
                    '[class*="gear" i]', '[class*="resolution" i]', '[class*="menu" i]',
                    '[aria-label*="Settings" i]', '[aria-label*="Quality" i]', '[title*="Quality" i]',
                    '[title*="Settings" i]', 'button svg', 'video'
                  ];
                  const re = new RegExp(`(^|\\D)${QUALITY}\\s*p?(\\D|$)`, 'i');
                  for (const frame of page.frames()) {
                    for (const s of menuSels) {
                      try {
                        const el = await frame.$(s);
                        if (el && await el.isVisible().catch(() => false)) {
                          await el.click({ timeout: 1000, force: true }).catch(() => {});
                          await page.waitForTimeout(500);
                          const opt = frame.getByText(re).first();
                          if (await opt.isVisible({ timeout: 500 }).catch(() => false)) {
                            console.log(`  Selecting ${QUALITY}p in player menu (${s})`);
                            await opt.click({ timeout: 1500, force: true }).catch(() => {});
                            await page.waitForTimeout(1500);
                            return true;
                          }
                        }
                      } catch (e) {}
                    }
                    try {
                      const opt = frame.getByText(re).first();
                      if (await opt.isVisible({ timeout: 300 }).catch(() => false)) {
                        console.log(`  Clicking visible ${QUALITY}p option`);
                        await opt.click({ timeout: 1500, force: true }).catch(() => {});
                        await page.waitForTimeout(1500);
                        return true;
                      }
                    } catch (e) {}
                  }
                  return false;
                };

                await readFromDom();
                await tryPlay();

                const maxWait = 60;
                let lastCount = -1, stable = 0;
                for (let s = 0; s < maxWait; s++) {
                  await page.waitForTimeout(1000);
                  if (s % 3 === 0) await trySkipAd();
                  if (s % 4 === 0) await readFromDom();
                  if (s % 10 === 9) await tryPlay();
                  if (s === 12 || s === 28) { await trySelectQuality(); await readFromDom(); }

                  if (cands.size > 0) {
                    if (cands.size === lastCount) stable++; else { stable = 0; lastCount = cands.size; }
                    if (s >= 30 && stable >= 12) break;
                  }
                }
                await readFromDom();

                if (cands.size === 0) {
                  for (const frame of page.frames()) {
                    try {
                      const html = (await frame.content()).replace(/\\\//g, '/').replace(/\\u0026/g, '&');
                      const m = html.match(/https?:\/\/[^"'\s<>\\]+\.(?:mp4|m3u8|webm|mkv|mov|m4v|vid)[^"'\s<>\\]*/gi) || [];
                      m.forEach(s => add(s, 'html'));
                    } catch (e) {}
                  }
                }

                if (cands.size === 0) {
                  console.log('  No video URL found.');
                  const text = await page.evaluate(() => document.body ? document.body.innerText.slice(0, 500) : '').catch(() => '');
                  console.log('  Page text start:\n' + text);
                  console.log('  Frames:', page.frames().map(f => f.url()).join(' | '));
                  fs.mkdirSync('debug', { recursive: true });
                  await page.screenshot({ path: `debug/page_${i + 1}.png`, fullPage: true }).catch(() => {});
                  fs.writeFileSync(`debug/page_${i + 1}.html`, await page.content().catch(() => ''));
                  await ctx.close();
                  continue;
                }

                const entries = [];
                const entryUrls = new Set();
                const pushEntry = (e) => { if (!entryUrls.has(e.url)) { entryUrls.add(e.url); entries.push(e); } };

                for (const [url, info] of cands) {
                  if (info.type === 'hls') {
                    const text = await fetchText(ctx, url, pageUrl);
                    if (text.includes('#EXT-X-STREAM-INF')) {
                      const vars = parseMaster(text, url);
                      console.log(`  Master playlist: ${url}\n    variants: ${vars.map(v => (v.height || '?') + 'p').join(', ')}`);
                      vars.forEach(v => pushEntry({ type: 'hls', url: v.url, audio: v.audio, height: v.height, why: 'master', order: info.order, master: url }));
                    } else {
                      pushEntry({ type: 'hls', url, audio: null, height: qualityFromUrl(url), why: info.why, order: info.order });
                    }
                  } else {
                    pushEntry({ type: 'file', url, audio: null, height: qualityFromUrl(url), why: info.why, order: info.order });
                  }
                }

                // اگر کیفیت هدف پیدا نشد، آدرس آن را از روی کیفیت دیگر بساز و امتحان کن
                if (!entries.some(e => e.height === QUALITY)) {
                  const BITRATES = ['500K', '600K', '700K', '800K', '900K', '1000K', '1200K', '1500K', '1800K', '2000K', '2500K', '3000K', '4000K'];
                  const bases = entries.filter(e => e.type === 'file' && /(^|\/)\d{3,4}P_\d+K_/i.test(e.url));
                  for (const b of bases) {
                    const u = new URL(b.url);
                    const dir = u.pathname.slice(0, u.pathname.lastIndexOf('/') + 1);
                    const base = decodeURIComponent(path.basename(u.pathname));
                    const mm = base.match(/^(\d{3,4})P_(\d+K)_(.+)$/i);
                    if (!mm) continue;
                    const tail = mm[3];
                    const tried = [];
                    const order2 = [mm[2].toUpperCase(), ...BITRATES.filter(x => x !== mm[2].toUpperCase())];
                    console.log(`  Probing ${QUALITY}P variants based on: ${base}`);
                    let foundUrl = null;
                    for (const br of order2) {
                      const nu = new URL(b.url);
                      nu.pathname = dir + `${QUALITY}P_${br}_${tail}`;
                      const cand = nu.href;
                      const sz = await probeSize(ctx, cand, pageUrl);
                      tried.push(`${QUALITY}P_${br} -> ${sz}`);
                      if (sz > MIN_SIZE) { foundUrl = cand; break; }
                    }
                    console.log('    ' + tried.join(' | '));
                    if (foundUrl) {
                      console.log('  Guessed URL works:', foundUrl);
                      pushEntry({ type: 'file', url: foundUrl, audio: null, height: QUALITY, why: 'guessed', order: b.order });
                      break;
                    } else {
                      console.log('  No guessed URL worked (token may be tied to file name).');
                    }
                  }
                }

                const list = [];
                for (const e of entries) {
                  let score = 0, size = 0, dur = 0;
                  const host = hostOf(e.url);
                  if (AD_RE.test(e.url)) score -= 100;
                  if (host === pageHost || host.endsWith('.' + pageHost.replace(/^www\./, ''))) score += 20;

                  if (e.height === 0 || e.height === QUALITY) {
                    const p = probeMedia(e.url, pageUrl);
                    if (e.height === 0) e.height = p.height;
                    dur = p.dur;
                  }
                  if (e.type === 'file') size = await probeSize(ctx, e.url, pageUrl);

                  if (e.height === QUALITY) score += 200;
                  else if (e.height > 0) score -= Math.min(100, Math.floor(Math.abs(e.height - QUALITY) / 5));

                  if (e.type === 'file') {
                    if (size >= BIG_SIZE) score += 50;
                    else if (size > 0 && size < 5 * 1024 * 1024) score -= 30;
                    score += Math.min(60, Math.floor(size / (50 * 1024 * 1024)) * 10);
                  } else {
                    if (dur >= 120) score += 50;
                    else if (dur > 0 && dur < 60) score -= 30;
                    score += Math.min(60, Math.floor(dur / 300) * 10);
                  }
                  list.push({ ...e, score, size, dur });
                }
                list.sort((a, b) => b.score - a.score || b.size - a.size || b.dur - a.dur || b.order - a.order);

                console.log('  --- Candidates (best first) ---');
                list.forEach((c, n) => console.log(`  #${n + 1} score=${c.score} type=${c.type} height=${c.height || '?'} size=${c.size} dur=${c.dur.toFixed(0)}s why=${c.why}\n      ${c.url}`));

                if (!list.some(c => c.height === QUALITY)) {
                  console.log(`  WARNING: ${QUALITY}p not found, nearest quality will be used.`);
                }

                let done = false;
                let k = 0;
                for (const c of list) {
                  k++;
                  console.log(`  Downloading #${k} (${c.height || '?'}p):`, c.url);
                  if (c.type === 'file') {
                    const out = path.join('downloads', fileNameFrom(c.url, i + 1, k));
                    if (await downloadDirect(ctx, c.url, pageUrl, out)) { done = true; break; }
                  } else {
                    const out = path.join('downloads', `${pageId(pageUrl, i + 1)}_${c.height || 'x'}p.mp4`);
                    if (downloadHls(c.url, c.audio, pageUrl, out)) { done = true; break; }
                  }
                }

                if (done) success++;
                else console.log('  All candidates failed.');
              } catch (e) {
                console.log('  Error:', e.message);
              }
              await ctx.close();
            }

            await browser.close();
            console.log(`\nSuccess: ${success} / ${urls.length}`);
            process.exit(success > 0 ? 0 : 1);
          })();
          EOF

      - name: Find and download
        id: grab
        continue-on-error: true
        env:
          URLS: ${{ github.event.inputs.urls }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: node grab.js

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Clean empty files
        id: clean
        if: always()
        run: |
          mkdir -p downloads
          find downloads -type f -size -1c -print -delete
          find downloads -type f -size -100k -print -delete
          ls -lh downloads/ || true
          if [ -n "$(find downloads -type f | head -1)" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.clean.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asia-${{ github.run_number }}
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if nothing downloaded
        if: steps.clean.outputs.has_files != 'true'
        run: |
          echo "No valid file was downloaded."
          exit 1
