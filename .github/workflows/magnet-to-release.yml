name: Download Magnet to Release

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'لینک مگنت'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Download via magnet link
        run: |
          mkdir -p downloads
          aria2c \
            --dir=downloads \
            --seed-time=0 \
            --seed-ratio=0.0 \
            --max-connection-per-server=16 \
            --split=16 \
            --bt-stop-timeout=300 \
            "${{ inputs.magnet_link }}"

      - name: List downloaded files
        run: ls -lh downloads

      - name: Generate release tag
        id: tag
        run: echo "tag=release-$(date +'%Y%m%d-%H%M%S')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            downloads/* \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "دانلود شده از مگنت لینک به‌صورت خودکار" \
            --repo "${{ github.repository }}"
