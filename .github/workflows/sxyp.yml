name: Downloader (Page to .vid)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Page URLs or direct .vid URLs (space or newline separated)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p downloads
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Write script
        shell: bash
        run: |
          cat > grab.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const VID_RE = /\.vid(\?|#|$)/i;
          const urls = (process.env.URLS || '').split(/\s+/).filter(u => /^https?:\/\//.test(u));
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';

          function nameFrom(u, i, k) {
            try {
              const n = path.basename(new URL(u).pathname);
              if (n && VID_RE.test(n)) return n;
            } catch (e) {}
            return `video_${i}_${k}.vid`;
          }

          function absolute(u, base) {
            try { return new URL(u, base).href; } catch (e) { return null; }
          }

          // دانلود با همان کانتکست مرورگر (کوکی‌ها + ریدایرکت‌ها)
          async function download(ctx, videoUrl, referer, outPath) {
            const res = await ctx.request.get(videoUrl, {
              headers: { Referer: referer, Accept: '*/*' },
              maxRedirects: 10,
              timeout: 900000
            });
            console.log('  Final URL:', res.url());
            console.log('  Status:', res.status());
            if (!res.ok()) {
              const body = (await res.body()).slice(0, 200).toString();
              console.log('  Body start:', body);
              return false;
            }
            fs.writeFileSync(outPath, await res.body());
            return true;
          }

          async function saveIfBig(out) {
            const size = fs.statSync(out).size;
            if (size > 102400) { console.log(`  OK: ${out} (${size} bytes)`); return true; }
            console.log('  File too small, removing.');
            fs.unlinkSync(out);
            return false;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--autoplay-policy=no-user-gesture-required', '--no-sandbox']
            });
            let success = 0;

            for (let i = 0; i < urls.length; i++) {
              const pageUrl = urls[i];
              console.log(`\n[${i + 1}] ${pageUrl}`);
              const ctx = await browser.newContext({
                userAgent: UA,
                viewport: { width: 1280, height: 720 }
              });

              try {
                // لینک مستقیم .vid
                if (VID_RE.test(pageUrl)) {
                  const out = path.join('downloads', nameFrom(pageUrl, i + 1, 1));
                  const origin = new URL(pageUrl).origin + '/';
                  if (await download(ctx, pageUrl, origin, out) && await saveIfBig(out)) success++;
                  await ctx.close();
                  continue;
                }

                const found = new Set();
                const page = await ctx.newPage();

                const add = (u, why) => {
                  if (!u || !VID_RE.test(u)) return;
                  if (!found.has(u)) { found.add(u); console.log(`  Found .vid (${why}):`, u); }
                };

                page.on('request', r => add(r.url(), 'request'));
                page.on('response', r => add(r.url(), 'response'));

                await page.goto(pageUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(3000);

                // خواندن src تگ video (آدرس نسبی را کامل می‌کنیم)
                const readVideoSrcs = async () => {
                  for (const frame of page.frames()) {
                    try {
                      const srcs = await frame.evaluate(() =>
                        Array.from(document.querySelectorAll('video, video source'))
                          .map(v => v.getAttribute('src') || v.currentSrc || '').filter(Boolean));
                      const base = frame.url() || pageUrl;
                      srcs.forEach(s => add(absolute(s, base), 'video src'));
                    } catch (e) {}
                  }
                };

                await readVideoSrcs();

                // اگر چیزی پیدا نشد، پخش را امتحان کن
                if (found.size === 0) {
                  for (const frame of page.frames()) {
                    try {
                      await frame.evaluate(() => {
                        document.querySelectorAll('video').forEach(v => {
                          v.muted = true;
                          v.play().catch(() => {});
                        });
                      });
                      for (const sel of ['.vjs-big-play-button', '.jw-icon-display', '.plyr__control--overlaid', 'button[aria-label*="Play" i]', '.play-button', '.play', 'video']) {
                        const el = await frame.$(sel);
                        if (el) await el.click({ timeout: 2000 }).catch(() => {});
                      }
                    } catch (e) {}
                  }
                  for (let t = 0; t < 20 && found.size === 0; t++) {
                    await page.waitForTimeout(1000);
                    await readVideoSrcs();
                  }
                }

                // آخرین تلاش: جستجو در HTML
                if (found.size === 0) {
                  for (const frame of page.frames()) {
                    try {
                      const html = (await frame.content()).replace(/\\\//g, '/');
                      const m = html.match(/(?:https?:)?\/\/[^"'\s<>\\]+\.vid[^"'\s<>]*|\/[^"'\s<>\\]+\.vid[^"'\s<>]*/gi) || [];
                      m.forEach(s => add(absolute(s, frame.url() || pageUrl), 'html'));
                    } catch (e) {}
                  }
                }

                if (found.size === 0) {
                  console.log('  No .vid URL found.');
                  await page.screenshot({ path: `downloads/debug_${i + 1}.png` }).catch(() => {});
                  await ctx.close();
                  continue;
                }

                // اگر هم لینک /cdn8/ (اولیه) و هم لینک نهایی /widi/ پیدا شد، هر دو یک فایل‌اند؛
                // فقط تا اولین دانلود موفق ادامه می‌دهیم.
                let k = 0;
                for (const target of found) {
                  k++;
                  console.log('  Downloading:', target);
                  const out = path.join('downloads', nameFrom(target, i + 1, k));
                  if (await download(ctx, target, pageUrl, out) && await saveIfBig(out)) {
                    success++;
                    break;
                  }
                }
              } catch (e) {
                console.log('  Error:', e.message);
              }
              await ctx.close();
            }

            await browser.close();
            console.log(`\nSuccess: ${success} file(s)`);
            process.exit(success > 0 ? 0 : 1);
          })();
          EOF

      - name: Find and download
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: node grab.js

      - name: List files
        if: always()
        run: ls -lh downloads/ || true

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asia-${{ github.run_number }}
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
