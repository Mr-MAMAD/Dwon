      - name: Download
        shell: bash
        env:
          URLS: ${{ github.event.inputs.urls }}
          REFERER: ${{ github.event.inputs.referer }}
        run: |
          success=0
          total=0
          failed_urls=""
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          echo "IP خروجی runner: $(curl -s https://api.ipify.org || echo نامشخص)"

          while IFS= read -r url; do
            url=$(echo "$url" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [ -z "$url" ] && continue

            if ! echo "$url" | grep -qE '^https?://'; then
              echo "⚠️ رد کردن آدرس نامعتبر: $url"
              failed_urls="${failed_urls}${url} (نامعتبر)\n"
              continue
            fi

            total=$((total+1))
            echo "=========================================="
            echo "[$total] در حال دانلود: $url"
            echo "=========================================="

            if echo "$url" | grep -q 'file='; then
              file_param=$(echo "$url" | sed -n 's/.*file=\([^&]*\).*/\1/p' | python3 -c "import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))")
              filename=$(basename "$file_param")
            else
              filename=$(basename "${url%%\?*}")
            fi
            [ -z "$filename" ] && filename="video_${total}"
            echo "ذخیره به عنوان: $filename"

            self_origin=$(echo "$url" | sed -E 's#^(https?://[^/]+).*#\1/#')
            variants=("NONE" "$REFERER" "$self_origin")
            ok=false

            for ref in "${variants[@]}"; do
              refargs=()
              [ "$ref" != "NONE" ] && refargs=(-e "$ref")
              echo "--- تلاش با referer: $ref"

              code=$(curl -sS -L -A "$UA" -H "Accept: */*" "${refargs[@]}" \
                --connect-timeout 30 \
                -D /tmp/headers.txt \
                -o "downloads/$filename" \
                -w '%{http_code}' "$url" || echo "000")

              echo "کد پاسخ: $code"
              if [ "$code" = "200" ] || [ "$code" = "206" ]; then
                ok=true
                break
              fi

              echo "هدرهای پاسخ سرور:"
              cat /tmp/headers.txt 2>/dev/null | head -20
              echo "ابتدای بدنه‌ی پاسخ:"
              head -c 300 "downloads/$filename" 2>/dev/null; echo
              rm -f "downloads/$filename"
              sleep 2
            done

            if [ "$ok" != true ]; then
              echo "❌ خطا در دانلود: $url"
              failed_urls="${failed_urls}${url} (همه‌ی حالت‌ها شکست خوردند)\n"
              continue
            fi

            size=$(stat -c%s "downloads/$filename" 2>/dev/null || echo 0)
            if [ "$size" -le 102400 ]; then
              echo "❌ فایل خیلی کوچک است ($size بایت)"
              failed_urls="${failed_urls}${url} (فایل کوچک: ${size} بایت)\n"
              rm -f "downloads/$filename"
              continue
            fi

            echo "✅ دانلود شد: $filename ($(numfmt --to=iec "$size"))"
            success=$((success+1))
            echo ""
          done < <(printf '%s\n' "$URLS" | tr -s ' \t' '\n')

          echo ""
          echo "=========================================="
          echo "📊 گزارش نهایی"
          echo "=========================================="
          echo "کل لینک‌های معتبر: $total"
          echo "دانلود موفق: $success"
          echo "دانلود ناموفق: $((total - success))"
          echo ""

          if [ -n "$failed_urls" ]; then
            echo "❌ لینک‌های دانلود نشده:"
            echo -e "$failed_urls"
          fi

          ls -lh downloads/ 2>/dev/null || echo "هیچ فایلی موجود نیست"

          if [ $success -eq 0 ]; then
            echo "⛔ هیچ فایلی با موفقیت دانلود نشد!"
            exit 1
          fi
