name: Downloader (Smart Split)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Video URLs (space or newline separated)'
        required: true
        type: string
      referer:
        description: 'Referer (برای trafficdeposit همین پیش‌فرض معمولاً کافی است)'
        required: false
        default: 'https://sxyprn.com/'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl
          mkdir -p downloads

      - name: Download
        shell: bash
        env:
          URLS: ${{ github.event.inputs.urls }}
          REFERER: ${{ github.event.inputs.referer }}
        run: |
          success=0
          total=0
          failed_urls=""
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          ORIGIN=$(echo "$REFERER" | sed -E 's#^(https?://[^/]+).*#\1#')

          while IFS= read -r url; do
            url=$(echo "$url" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [ -z "$url" ] && continue

            if ! echo "$url" | grep -qE '^https?://'; then
              echo "⚠️ رد کردن آدرس نامعتبر: $url"
              failed_urls="${failed_urls}${url} (نامعتبر)\n"
              continue
            fi

            total=$((total+1))

            echo "=========================================="
            echo "[$total] در حال دانلود: $url"
            echo "=========================================="

            # استخراج نام فایل (بدون تغییر پسوند)
            if echo "$url" | grep -q 'file='; then
              file_param=$(echo "$url" | sed -n 's/.*file=\([^&]*\).*/\1/p' | python3 -c "import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))")
              filename=$(basename "$file_param")
            else
              filename=$(basename "${url%%\?*}")
            fi
            [ -z "$filename" ] && filename="video_${total}"

            echo "ذخیره به عنوان: $filename"

            if ! curl -fL \
              -A "$UA" \
              -H "Accept: */*" \
              -H "Accept-Language: en-US,en;q=0.9" \
              -e "$REFERER" \
              -H "Origin: $ORIGIN" \
              --connect-timeout 30 \
              --retry 3 --retry-delay 5 --retry-all-errors \
              -o "downloads/$filename" \
              "$url"; then
              echo "❌ خطا در دانلود: $url"
              failed_urls="${failed_urls}${url} (خطای curl - احتمالاً لینک منقضی یا مسدود)\n"
              rm -f "downloads/$filename"
              continue
            fi

            size=$(stat -c%s "downloads/$filename" 2>/dev/null || echo 0)
            if [ "$size" -le 102400 ]; then
              echo "❌ فایل خیلی کوچک است ($size بایت)"
              failed_urls="${failed_urls}${url} (فایل کوچک: ${size} بایت)\n"
              rm -f "downloads/$filename"
              continue
            fi

            echo "✅ دانلود شد: $filename ($(numfmt --to=iec "$size"))"
            success=$((success+1))
            echo ""
          done < <(printf '%s\n' "$URLS" | tr -s ' \t' '\n')

          echo ""
          echo "=========================================="
          echo "📊 گزارش نهایی"
          echo "=========================================="
          echo "کل لینک‌های معتبر: $total"
          echo "دانلود موفق: $success"
          echo "دانلود ناموفق: $((total - success))"
          echo ""

          if [ -n "$failed_urls" ]; then
            echo "❌ لینک‌های دانلود نشده:"
            echo "=========================================="
            echo -e "$failed_urls"
            echo "=========================================="
          fi

          echo ""
          echo "فایل‌های دانلود شده:"
          ls -lh downloads/ 2>/dev/null || echo "هیچ فایلی موجود نیست"

          if [ $success -eq 0 ]; then
            echo ""
            echo "⛔ هیچ فایلی با موفقیت دانلود نشد!"
            exit 1
          fi

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asia-${{ github.run_number }}
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
