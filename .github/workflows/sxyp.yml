name: Downloader (Page to .vid)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Page URLs or direct .vid URLs (space or newline separated)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p downloads
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Write script
        shell: bash
        run: |
          cat > grab.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          // فقط فایل‌های .vid
          const VID_RE = /\.vid(\?|#|$)/i;
          const urls = (process.env.URLS || '').split(/\s+/).filter(u => /^https?:\/\//.test(u));

          function nameFrom(u, i, k) {
            try {
              const p = new URL(u);
              const n = path.basename(p.pathname);
              if (n && VID_RE.test(n)) return n;
            } catch (e) {}
            return `video_${i}_${k}.vid`;
          }

          async function download(ctx, videoUrl, referer, outPath) {
            const res = await ctx.request.get(videoUrl, {
              headers: { Referer: referer, Accept: '*/*' },
              timeout: 600000
            });
            console.log('  Download status:', res.status());
            if (!res.ok()) return false;
            fs.writeFileSync(outPath, await res.body());
            return true;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--autoplay-policy=no-user-gesture-required', '--no-sandbox']
            });
            let success = 0;

            for (let i = 0; i < urls.length; i++) {
              const pageUrl = urls[i];
              console.log(`\n[${i + 1}] ${pageUrl}`);
              const ctx = await browser.newContext({
                userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                viewport: { width: 1280, height: 720 }
              });

              try {
                // لینک مستقیم .vid
                if (VID_RE.test(pageUrl)) {
                  const out = path.join('downloads', nameFrom(pageUrl, i + 1, 1));
                  const origin = new URL(pageUrl).origin + '/';
                  if (await download(ctx, pageUrl, origin, out)) {
                    const size = fs.statSync(out).size;
                    if (size > 102400) { console.log(`  OK: ${out} (${size} bytes)`); success++; }
                    else { console.log('  File too small, removing.'); fs.unlinkSync(out); }
                  }
                  await ctx.close();
                  continue;
                }

                const found = new Set();
                const page = await ctx.newPage();

                const onUrl = (u) => {
                  if (VID_RE.test(u) && !found.has(u)) {
                    found.add(u);
                    console.log('  Found .vid URL:', u);
                  }
                };
                page.on('request', r => onUrl(r.url()));
                page.on('response', r => onUrl(r.url()));

                await page.goto(pageUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(4000);

                // تلاش برای پخش ویدیو در صفحه و iframe ها
                for (const frame of page.frames()) {
                  try {
                    await frame.evaluate(() => {
                      document.querySelectorAll('video').forEach(v => {
                        v.muted = true;
                        v.play().catch(() => {});
                      });
                    });
                    for (const sel of ['.vjs-big-play-button', '.jw-icon-display', '.plyr__control--overlaid', 'button[aria-label*="Play" i]', '.play-button', '.play', 'video']) {
                      const el = await frame.$(sel);
                      if (el) { await el.click({ timeout: 2000 }).catch(() => {}); }
                    }
                  } catch (e) {}
                }

                // منتظر ماندن برای پیدا شدن لینک .vid
                for (let t = 0; t < 25 && found.size === 0; t++) {
                  await page.waitForTimeout(1000);
                }

                // اگر پیدا نشد، src تگ‌های video و HTML فریم‌ها را بررسی کن
                if (found.size === 0) {
                  for (const frame of page.frames()) {
                    try {
                      const srcs = await frame.evaluate(() =>
                        Array.from(document.querySelectorAll('video, video source'))
                          .map(v => v.currentSrc || v.src).filter(Boolean));
                      srcs.forEach(s => { if (/^https?:/.test(s) && VID_RE.test(s)) found.add(s); });

                      const html = await frame.content();
                      const m = html.match(/https?:\\?\/\\?\/[^"'\s<>\\]+(?:\\\/[^"'\s<>\\]+)*\.vid[^"'\s<>]*/gi) || [];
                      m.forEach(s => found.add(s.replace(/\\\//g, '/')));
                    } catch (e) {}
                  }
                }

                if (found.size === 0) {
                  console.log('  No .vid URL found.');
                  await page.screenshot({ path: `downloads/debug_${i + 1}.png` }).catch(() => {});
                  await ctx.close();
                  continue;
                }

                let k = 0;
                for (const target of found) {
                  k++;
                  console.log('  Downloading:', target);
                  const out = path.join('downloads', nameFrom(target, i + 1, k));
                  if (await download(ctx, target, pageUrl, out)) {
                    const size = fs.statSync(out).size;
                    if (size > 102400) { console.log(`  OK: ${out} (${size} bytes)`); success++; }
                    else { console.log('  File too small, removing.'); fs.unlinkSync(out); }
                  }
                }
              } catch (e) {
                console.log('  Error:', e.message);
              }
              await ctx.close();
            }

            await browser.close();
            console.log(`\nSuccess: ${success} file(s)`);
            process.exit(success > 0 ? 0 : 1);
          })();
          EOF

      - name: Find and download
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: node grab.js

      - name: List files
        if: always()
        run: ls -lh downloads/ || true

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asia-${{ github.run_number }}
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
