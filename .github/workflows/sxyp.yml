name: Downloader (Page to .vid + WireGuard)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Page URLs or direct .vid URLs (space or newline separated)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools resolvconf

      - name: Connect WireGuard
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          echo "IP before: $(curl -s --max-time 20 https://api.ipify.org || echo unknown)"
          echo "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "IP after: $(curl -s --max-time 20 https://api.ipify.org || echo unknown)"
          echo "Country: $(curl -s --max-time 20 https://ipinfo.io/country || echo unknown)"

      - name: Setup Playwright
        run: |
          mkdir -p downloads
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Write script
        shell: bash
        run: |
          cat > grab.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const VID_RE = /\.vid(\?|#|$)/i;
          const urls = (process.env.URLS || '').split(/\s+/).filter(u => /^https?:\/\//.test(u));
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';

          function nameFrom(u, i, k) {
            try {
              const n = path.basename(new URL(u).pathname);
              if (n && VID_RE.test(n)) return n;
            } catch (e) {}
            return `video_${i}_${k}.vid`;
          }

          function absolute(u, base) {
            try { return new URL(u, base).href; } catch (e) { return null; }
          }

          async function download(ctx, videoUrl, referer, outPath) {
            const res = await ctx.request.get(videoUrl, {
              headers: { Referer: referer, Accept: '*/*' },
              maxRedirects: 10,
              timeout: 1800000
            });
            console.log('  Final URL:', res.url());
            console.log('  Status:', res.status());
            if (!res.ok()) {
              const body = (await res.body()).slice(0, 200).toString();
              console.log('  Body start:', body);
              return false;
            }
            fs.writeFileSync(outPath, await res.body());
            return true;
          }

          function saveIfBig(out) {
            const size = fs.statSync(out).size;
            if (size > 102400) { console.log(`  OK: ${out} (${size} bytes)`); return true; }
            console.log('  File too small, removing.');
            fs.unlinkSync(out);
            return false;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--autoplay-policy=no-user-gesture-required',
                '--no-sandbox',
                '--disable-blink-features=AutomationControlled'
              ]
            });
            let success = 0;

            for (let i = 0; i < urls.length; i++) {
              const pageUrl = urls[i];
              console.log(`\n[${i + 1}] ${pageUrl}`);
              const ctx = await browser.newContext({
                userAgent: UA,
                viewport: { width: 1280, height: 720 },
                locale: 'en-US'
              });
              await ctx.addInitScript(() => {
                Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              });

              try {
                if (VID_RE.test(pageUrl)) {
                  const out = path.join('downloads', nameFrom(pageUrl, i + 1, 1));
                  const origin = new URL(pageUrl).origin + '/';
                  if (await download(ctx, pageUrl, origin, out) && saveIfBig(out)) success++;
                  await ctx.close();
                  continue;
                }

                const found = new Set();
                const page = await ctx.newPage();

                const add = (u, why) => {
                  if (!u || !VID_RE.test(u)) return;
                  if (!found.has(u)) { found.add(u); console.log(`  Found .vid (${why}):`, u); }
                };

                page.on('request', r => add(r.url(), 'request'));

                const resp = await page.goto(pageUrl, { waitUntil: 'load', timeout: 90000 }).catch(e => { console.log('  goto error:', e.message); return null; });
                console.log('  Page status:', resp ? resp.status() : 'none');
                console.log('  Final page URL:', page.url());
                console.log('  Title:', await page.title().catch(() => '?'));
                await page.waitForTimeout(5000);

                // رد کردن صفحه‌ی تأیید سن / کوکی
                const clickTexts = ['Enter', 'I am 18', "I'm 18", 'I am over 18', 'Agree', 'Accept', 'Continue', 'Yes', 'ENTER'];
                for (const t of clickTexts) {
                  try {
                    const el = page.getByText(t, { exact: false }).first();
                    if (await el.isVisible({ timeout: 500 })) {
                      console.log('  Clicking:', t);
                      await el.click({ timeout: 2000 }).catch(() => {});
                      await page.waitForTimeout(2000);
                      break;
                    }
                  } catch (e) {}
                }

                const readFromPlayer = async () => {
                  for (const frame of page.frames()) {
                    try {
                      const base = frame.url() || pageUrl;
                      const vals = await frame.evaluate(() => {
                        const out = [];
                        document.querySelectorAll('meta[itemprop="contentUrl"]').forEach(m => out.push(m.content));
                        document.querySelectorAll('video, video source').forEach(v => {
                          out.push(v.getAttribute('src'));
                          out.push(v.currentSrc);
                        });
                        document.querySelectorAll('.ypsv-download a, a[download]').forEach(a => out.push(a.href));
                        return out.filter(Boolean);
                      });
                      vals.forEach(s => add(absolute(s, base), 'player'));
                    } catch (e) {}
                  }
                };
                await readFromPlayer();

                if (found.size === 0) {
                  for (const frame of page.frames()) {
                    try {
                      await frame.evaluate(() => {
                        document.querySelectorAll('video').forEach(v => { v.muted = true; v.play().catch(() => {}); });
                      });
                      for (const sel of ['.ypsv-ss', '.vjs-big-play-button', '.jw-icon-display', '.plyr__control--overlaid', 'video']) {
                        const el = await frame.$(sel);
                        if (el) await el.click({ timeout: 2000 }).catch(() => {});
                      }
                    } catch (e) {}
                  }
                  for (let t = 0; t < 15 && found.size === 0; t++) {
                    await page.waitForTimeout(1000);
                    await readFromPlayer();
                  }
                }

                if (found.size === 0) {
                  for (const frame of page.frames()) {
                    try {
                      const html = (await frame.content()).replace(/\\\//g, '/');
                      const m = html.match(/(?:https?:)?\/\/[^"'\s<>\\]+\.vid[^"'\s<>]*|\/[^"'\s<>\\]+\.vid[^"'\s<>]*/gi) || [];
                      m.forEach(s => add(absolute(s, frame.url() || pageUrl), 'html'));
                    } catch (e) {}
                  }
                }

                if (found.size === 0) {
                  console.log('  No .vid URL found.');
                  const text = await page.evaluate(() => document.body ? document.body.innerText.slice(0, 500) : '').catch(() => '');
                  console.log('  Page text start:\n' + text);
                  console.log('  Frames:', page.frames().map(f => f.url()).join(' | '));
                  console.log('  Has <video>:', await page.evaluate(() => document.querySelectorAll('video').length).catch(() => '?'));
                  fs.mkdirSync('debug', { recursive: true });
                  await page.screenshot({ path: `debug/page_${i + 1}.png`, fullPage: true }).catch(() => {});
                  fs.writeFileSync(`debug/page_${i + 1}.html`, await page.content().catch(() => ''));
                  await ctx.close();
                  continue;
                }

                let k = 0;
                for (const target of found) {
                  k++;
                  console.log('  Downloading:', target);
                  const out = path.join('downloads', nameFrom(target, i + 1, k));
                  if (await download(ctx, target, pageUrl, out) && saveIfBig(out)) {
                    success++;
                    break;
                  }
                }
              } catch (e) {
                console.log('  Error:', e.message);
              }
              await ctx.close();
            }

            await browser.close();
            console.log(`\nSuccess: ${success} file(s)`);
            process.exit(success > 0 ? 0 : 1);
          })();
          EOF

      - name: Find and download
        id: grab
        continue-on-error: true
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: node grab.js

      - name: Disconnect WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: List files
        if: always()
        run: ls -lh downloads/ || true

      - name: Release
        if: steps.grab.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asia-${{ github.run_number }}
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if nothing downloaded
        if: steps.grab.outcome != 'success'
        run: exit 1
