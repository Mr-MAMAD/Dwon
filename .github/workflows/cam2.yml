name: cam2 Downloader (Smart Split)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'آدرس ویدیوها (با فاصله یا خط جدید جدا شوند). برای انتخاب نام دلخواه از فرمت URL|نام_فایل.mp4 استفاده کنید (بدون فاصله در نام فایل)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl
          mkdir -p downloads

      - name: Download
        shell: bash
        run: |
          success=0
          total=0
          failed_urls=""

          while IFS= read -r line; do
            line=$(echo "$line" | xargs)
            [ -z "$line" ] && continue

            # فرمت ورودی: URL   یا   URL|نام_دلخواه
            if [[ "$line" == *"|"* ]]; then
              url=$(echo "${line%%|*}" | xargs)
              custom_name=$(echo "${line#*|}" | xargs)
            else
              url="$line"
              custom_name=""
            fi

            if ! echo "$url" | grep -qE '^https?://'; then
              echo "⚠️ رد کردن آدرس نامعتبر: $url"
              failed_urls="${failed_urls}${url} (نامعتبر)\n"
              continue
            fi

            total=$((total+1))

            echo "=========================================="
            echo "[$total] در حال دانلود: $url"
            echo "=========================================="

            # تعیین نام فایل: اول اولویت با نام دلخواه کاربر
            if [ -n "$custom_name" ]; then
              filename=$(basename "$custom_name")
              echo "نام دلخواه انتخاب شد: $filename"
            elif echo "$url" | grep -q 'file='; then
              file_param=$(echo "$url" | sed -n 's/.*file=\([^&]*\).*/\1/p' | python3 -c "import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))")
              filename=$(basename "$file_param")
            else
              filename=$(basename "$url" | cut -d'?' -f1)
            fi

            [ -z "$filename" ] && filename="video_${total}.mp4"

            # جلوگیری از رونویسی فایل‌های هم‌نام
            base_filename="$filename"
            counter=1
            while [ -f "downloads/$filename" ]; do
              if [[ "$base_filename" == *.* ]]; then
                filename="${base_filename%.*}_${counter}.${base_filename##*.}"
              else
                filename="${base_filename}_${counter}"
              fi
              counter=$((counter+1))
            done

            echo "ذخیره به عنوان: $filename"

            download_failed=false

            # هدر Referer/Origin را از خود URL می‌سازیم تا برای هر دامنه درست باشد
            url_origin=$(echo "$url" | grep -oE '^https?://[^/]+')

            curl -L \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Referer: https://www.camwhores.tv/" \
              -H "Origin: https://www.camwhores.tv" \
              --connect-timeout 30 \
              --retry 2 \
              -o "downloads/$filename" \
              "$url" 2>&1 || download_failed=true

            if [ "$download_failed" = true ]; then
              echo "❌ خطا در دانلود: $url"
              failed_urls="${failed_urls}${url} (خطای curl)\n"
              continue
            fi

            if [ -f "downloads/$filename" ]; then
              size=$(stat -c%s "downloads/$filename" 2>/dev/null || echo 0)
              if [ "$size" -gt 102400 ]; then
                echo "✅ دانلود شد: $filename ($(numfmt --to=iec $size))"
                success=$((success+1))
              else
                echo "❌ فایل خیلی کوچک است ($size بایت)"
                failed_urls="${failed_urls}${url} (فایل کوچک: ${size} بایت)\n"
                rm -f "downloads/$filename"
              fi
            else
              echo "❌ فایل ایجاد نشد: $filename"
              failed_urls="${failed_urls}${url} (فایل ذخیره نشد)\n"
            fi
            echo ""
          done < <(echo "${{ github.event.inputs.urls }}" | tr ' ' '\n')

          echo ""
          echo "=========================================="
          echo "📊 گزارش نهایی"
          echo "=========================================="
          echo "کل لینک‌های معتبر: $total"
          echo "دانلود موفق: $success"
          echo "دانلود ناموفق: $((total - success))"
          echo ""

          if [ -n "$failed_urls" ]; then
            echo "❌ لینک‌های دانلود نشده:"
            echo "=========================================="
            echo -e "$failed_urls"
            echo "=========================================="
          fi

          echo ""
          echo "فایل‌های دانلود شده:"
          ls -lh downloads/ 2>/dev/null || echo "هیچ فایلی موجود نیست"

          if [ $success -eq 0 ]; then
            echo ""
            echo "⛔ هیچ فایلی با موفقیت دانلود نشد!"
            exit 1
          fi

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cam-${{ github.run_number }}
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
