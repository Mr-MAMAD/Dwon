name: phub3 Downloader (Find Video)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Page URLs (space or newline separated)'
        required: true
        default: 'https://vidara.so/v/cpbnwULfofbCA'
        type: string
      quality:
        description: 'Preferred quality (height), e.g. 240 / 480 / 720'
        required: true
        default: '480'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          mkdir -p downloads
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Write script
        shell: bash
        run: |
          cat > grab.js << 'EOF'
          const { chromium } = require('playwright');
          const { spawnSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const FILE_RE = /\.(mp4|webm|mkv|mov|m4v|vid)(\?|#|$)/i;
          const HLS_RE = /\.m3u8(\?|#|$)/i;
          const SEG_RE = /(\.m4s|\.ts)(\?|#|$)|\/(init|seg)[-_][^\/]*\.mp4(\?|#|$)/i;
          const AD_RE = /(doubleclick|googlesyndication|googleads|exoclick|exosrv|adsco|adserver|adsystem|adnxs|popads|popcash|propeller|juicyads|trafficjunky|vast|vpaid|\/ads?\/|[\/_.-]ads?[\/_.-]|advert|banner|preroll|pre-roll|promo|sponsor|clickadu|hilltopads|adcash|ero-advertising|tsyndicate|syndication)/i;
          const urls = (process.env.URLS || '').split(/\s+/).filter(u => /^https?:\/\//.test(u));
          const QUALITY = parseInt(process.env.QUALITY || '480', 10) || 480;
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';
          const MIN_SIZE = 102400;
          const BIG_SIZE = 20 * 1024 * 1024;

          console.log('Target quality:', QUALITY + 'p');

          function pageId(u, i) {
            try {
              const last = path.basename(new URL(u).pathname);
              return last || `video_${i}`;
            } catch (e) { return `video_${i}`; }
          }

          function fileNameFrom(u, i, k) {
            try {
              const n = path.basename(new URL(u).pathname);
              if (n && FILE_RE.test(n)) return n;
            } catch (e) {}
            return `video_${i}_${k}.mp4`;
          }

          function hostOf(u) { try { return new URL(u).hostname; } catch (e) { return ''; } }

          function qualityFromUrl(u) {
            let name = '';
            try { name = decodeURIComponent(u.split('?')[0]); } catch (e) { name = u; }
            const m = name.match(/(?:^|[\/_])(\d{3,4})P?_\d+K/i) || name.match(/[\/_.\-](144|240|360|480|540|720|1080|1440|2160)p?(?:[\/_.\-]|$)/i);
            return m ? parseInt(m[1], 10) : 0;
          }

          function nearest(list, getH) {
            let best = null, bd = 1e9;
            for (const it of list) {
              const h = getH(it);
              if (!h) continue;
              const d = Math.abs(h - QUALITY);
              if (d < bd) { bd = d; best = it; }
            }
            return best;
          }

          function browserHeaders(pageUrl, cookie) {
            const h = { 'Referer': pageUrl, 'Origin': new URL(pageUrl).origin, 'Accept': '*/*', 'Accept-Language': 'en-US,en;q=0.9' };
            if (cookie) h['Cookie'] = cookie;
            return h;
          }

          function ffHeaderString(h) {
            return Object.keys(h).map(k => `${k}: ${h[k]}\r\n`).join('');
          }

          async function probeSize(ctx, url, referer) {
            try {
              const r = await ctx.request.get(url, {
                headers: { Referer: referer, Range: 'bytes=0-0', Accept: '*/*' },
                maxRedirects: 10,
                timeout: 20000
              });
              const cr = r.headers()['content-range'];
              if (cr && /\/(\d+)$/.test(cr)) return parseInt(cr.match(/\/(\d+)$/)[1], 10);
              const cl = r.headers()['content-length'];
              if (cl && r.status() === 200) return parseInt(cl, 10);
            } catch (e) {}
            return 0;
          }

          async function downloadDirect(ctx, url, referer, out) {
            try { fs.unlinkSync(out); } catch (e) {}
            const res = await ctx.request.get(url, {
              headers: { Referer: referer, Accept: '*/*' },
              maxRedirects: 10,
              timeout: 1800000
            });
            console.log('  Final URL:', res.url());
            console.log('  Status:', res.status());
            if (!res.ok()) return false;
            const body = await res.body();
            if (body.length < MIN_SIZE) { console.log('  Too small:', body.length); return false; }
            fs.writeFileSync(out, body);
            console.log(`  OK: ${out} (${body.length} bytes)`);
            return true;
          }

          async function getText(ctx, url, headers) {
            try {
              const r = await ctx.request.get(url, { headers, timeout: 30000, maxRedirects: 10 });
              if (!r.ok()) {
                console.log('  playlist status:', r.status(), url.slice(0, 120));
                console.log('  body start:', (await r.text().catch(() => '')).slice(0, 150).replace(/\s+/g, ' '));
                return '';
              }
              return await r.text();
            } catch (e) { console.log('  playlist error:', e.message); return ''; }
          }

          function parseMaster(text, base) {
            const lines = text.split(/\r?\n/);
            const audios = {};
            lines.forEach(l => {
              if (l.startsWith('#EXT-X-MEDIA') && /TYPE=AUDIO/.test(l)) {
                const g = (l.match(/GROUP-ID="([^"]+)"/) || [])[1];
                const u = (l.match(/URI="([^"]+)"/) || [])[1];
                if (g && u) { try { audios[g] = new URL(u, base).href; } catch (e) {} }
              }
            });
            const vars = [];
            for (let n = 0; n < lines.length; n++) {
              const l = lines[n];
              if (!l.startsWith('#EXT-X-STREAM-INF')) continue;
              const res = l.match(/RESOLUTION=(\d+)x(\d+)/);
              const bw = parseInt((l.match(/BANDWIDTH=(\d+)/) || [])[1] || '0', 10);
              const ag = (l.match(/AUDIO="([^"]+)"/) || [])[1];
              let m = n + 1;
              while (m < lines.length && (!lines[m].trim() || lines[m].startsWith('#'))) m++;
              if (m >= lines.length) continue;
              try {
                const vurl = new URL(lines[m].trim(), base).href;
                const height = res ? Math.min(parseInt(res[1], 10), parseInt(res[2], 10)) : qualityFromUrl(vurl);
                vars.push({ url: vurl, height, bw, audio: ag ? (audios[ag] || null) : null });
              } catch (e) {}
            }
            return vars;
          }

          function runFfmpegHls(url, audio, headers, out) {
            try { fs.unlinkSync(out); } catch (e) {}
            const hs = ffHeaderString(headers);
            const args = ['-y', '-loglevel', 'error', '-user_agent', UA, '-headers', hs, '-i', url];
            if (audio) args.push('-user_agent', UA, '-headers', hs, '-i', audio, '-map', '0:v:0', '-map', '1:a:0');
            args.push('-c', 'copy', out);
            const r = spawnSync('ffmpeg', args, { stdio: 'inherit' });
            const size = fs.existsSync(out) ? fs.statSync(out).size : 0;
            if (r.status === 0 && size >= MIN_SIZE) { console.log(`  OK: ${out} (${size} bytes)`); return true; }
            if (fs.existsSync(out)) fs.unlinkSync(out);
            return false;
          }

          // دانلود دستی قطعه‌ها با session مرورگر
          async function manualHls(ctx, url, headers, out) {
            const tmp = out + '.tmp.bin';
            try {
              let text = await getText(ctx, url, headers);
              if (!text) return false;
              if (text.includes('#EXT-X-STREAM-INF')) {
                const vars = parseMaster(text, url);
                const v = vars.find(x => x.height === QUALITY) || nearest(vars, x => x.height) || vars[0];
                if (!v) return false;
                url = v.url;
                text = await getText(ctx, url, headers);
                if (!text) return false;
              }
              const lines = text.split(/\r?\n/);
              const mapM = text.match(/#EXT-X-MAP:URI="([^"]+)"/);
              const segs = lines.filter(l => l.trim() && !l.startsWith('#')).map(l => new URL(l.trim(), url).href);
              console.log(`  Manual HLS: ${segs.length} segments`);
              if (!segs.length) return false;
              try { fs.unlinkSync(tmp); } catch (e) {}

              const fetchBin = async (u) => {
                for (let a = 0; a < 3; a++) {
                  try {
                    const r = await ctx.request.get(u, { headers, timeout: 60000, maxRedirects: 10 });
                    if (r.ok()) return await r.body();
                    if (a === 2) console.log('  segment status:', r.status(), u.slice(0, 120));
                  } catch (e) {}
                  await new Promise(r => setTimeout(r, 1000));
                }
                return null;
              };

              if (mapM) {
                const init = await fetchBin(new URL(mapM[1], url).href);
                if (!init) return false;
                fs.appendFileSync(tmp, init);
              }
              const BATCH = 6;
              for (let i = 0; i < segs.length; i += BATCH) {
                const bodies = await Promise.all(segs.slice(i, i + BATCH).map(fetchBin));
                for (const b of bodies) {
                  if (!b) { console.log('  Segment failed, aborting manual download'); return false; }
                  fs.appendFileSync(tmp, b);
                }
                if ((i / BATCH) % 10 === 0) console.log(`  ...${Math.min(i + BATCH, segs.length)}/${segs.length}`);
              }
              try { fs.unlinkSync(out); } catch (e) {}
              const r = spawnSync('ffmpeg', ['-y', '-loglevel', 'error', '-i', tmp, '-c', 'copy', out], { stdio: 'inherit' });
              const size = fs.existsSync(out) ? fs.statSync(out).size : 0;
              if (r.status === 0 && size >= MIN_SIZE) { console.log(`  OK (manual): ${out} (${size} bytes)`); return true; }
              if (fs.existsSync(out)) fs.unlinkSync(out);
              return false;
            } finally {
              try { fs.unlinkSync(tmp); } catch (e) {}
            }
          }

          function probeWH(file) {
            const r = spawnSync('ffprobe', ['-v', 'error', '-select_streams', 'v:0', '-show_entries', 'stream=width,height', '-of', 'csv=p=0', file], { encoding: 'utf8' });
            return (r.stdout || '').trim();
          }

          // یک آدرس m3u8 (master یا variant) را در کیفیت هدف دانلود می‌کند
          async function downloadPlaylist(ctx, url, headers, outBase) {
            let target = { url, audio: null, height: qualityFromUrl(url) };
            const text = await getText(ctx, url, headers);
            if (text.includes('#EXT-X-STREAM-INF')) {
              const vars = parseMaster(text, url);
              console.log('  Variants:', vars.map(v => (v.height || '?') + 'p').join(', '));
              const exact = vars.filter(v => v.height === QUALITY).sort((a, b) => b.bw - a.bw)[0];
              target = exact || nearest(vars, v => v.height) || vars[0] || target;
            }
            console.log(`  Using ${target.height || '?'}p:`, target.url);
            const out = path.join('downloads', `${outBase}_${target.height || QUALITY}p.mp4`);
            console.log('  Trying ffmpeg...');
            if (runFfmpegHls(target.url, target.audio, headers, out)) { console.log('  Video size (w,h):', probeWH(out)); return true; }
            console.log('  ffmpeg failed, trying manual segment download...');
            if (await manualHls(ctx, target.url, headers, out)) { console.log('  Video size (w,h):', probeWH(out)); return true; }
            return false;
          }

          // خواندن flashvars پلیر (در صورت وجود)
          async function getFlashvars(page) {
            for (const frame of page.frames()) {
              try {
                const fv = await frame.evaluate(() => {
                  const keys = Object.keys(window).filter(k => k.indexOf('flashvars_') === 0);
                  for (const k of keys) {
                    const v = window[k];
                    if (v && Array.isArray(v.mediaDefinitions)) return { id: k.replace('flashvars_', ''), defs: v.mediaDefinitions };
                  }
                  return null;
                });
                if (fv) return fv;
              } catch (e) {}
            }
            return null;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--autoplay-policy=no-user-gesture-required', '--no-sandbox', '--disable-blink-features=AutomationControlled']
            });
            let success = 0;

            for (let i = 0; i < urls.length; i++) {
              const pageUrl = urls[i];
              const pageHost = hostOf(pageUrl);
              console.log(`\n[${i + 1}] ${pageUrl}`);
              const ctx = await browser.newContext({
                userAgent: UA,
                viewport: { width: 1280, height: 720 },
                locale: 'en-US'
              });
              await ctx.addInitScript(() => {
                Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              });

              try {
                const cands = new Map();
                let order = 0;

                const add = (u, why) => {
                  if (!u || !/^https?:/i.test(u)) return;
                  const clean = u.replace(/#\.mp4$/, '');
                  if (cands.has(clean)) return;
                  let type = null;
                  if (HLS_RE.test(clean)) type = 'hls';
                  else if (FILE_RE.test(clean) || why === 'content-type') type = 'file';
                  if (!type) return;
                  cands.set(clean, { type, why, order: order++ });
                  console.log(`  Found ${type} (${why}):`, clean);
                };

                const page = await ctx.newPage();

                ctx.on('page', async p => {
                  if (p === page) return;
                  await p.waitForTimeout(1000).catch(() => {});
                  console.log('  Closing popup:', p.url());
                  await p.close().catch(() => {});
                });

                page.on('request', r => add(r.url(), 'request'));
                page.on('response', r => {
                  const ct = (r.headers()['content-type'] || '').toLowerCase();
                  if (ct.startsWith('video/')) add(r.url(), 'content-type');
                  if (ct.includes('mpegurl')) add(r.url(), 'content-type');
                });

                const resp = await page.goto(pageUrl, { waitUntil: 'load', timeout: 90000 }).catch(e => { console.log('  goto error:', e.message); return null; });
                console.log('  Page status:', resp ? resp.status() : 'none');
                console.log('  Final page URL:', page.url());
                console.log('  Title:', await page.title().catch(() => '?'));
                await page.waitForTimeout(3000);

                const cookieStr = async () => (await ctx.cookies()).map(c => `${c.name}=${c.value}`).join('; ');

                // ---------- روش ۱: داده‌ی پلیر (flashvars.mediaDefinitions) ----------
                let fv = null;
                for (let t = 0; t < 4 && !fv; t++) {
                  fv = await getFlashvars(page);
                  if (!fv) await page.waitForTimeout(1000);
                }
                const baseName = fv ? fv.id : pageId(pageUrl, i + 1);

                if (fv) {
                  const hls = fv.defs.filter(d => d && d.format === 'hls' && typeof d.videoUrl === 'string' && d.videoUrl);
                  console.log('  mediaDefinitions (hls):', hls.map(d => `${d.quality || d.height}p`).join(', ') || '(none)');
                  let pick = hls.find(d => String(d.quality) === String(QUALITY) || Number(d.height) === QUALITY);
                  if (!pick) pick = nearest(hls, d => Number(d.height) || parseInt(d.quality, 10) || 0);
                  if (pick) {
                    const vurl = pick.videoUrl.replace(/\\\//g, '/');
                    console.log('  Method 1 (player data):', vurl);
                    if (await downloadPlaylist(ctx, vurl, browserHeaders(pageUrl, await cookieStr()), baseName)) {
                      success++; await ctx.close(); continue;
                    }
                    console.log('  Method 1 failed, continuing with player method...');
                  }
                }

                // ---------- روش ۲: انتخاب کیفیت در پلیر قبل از پخش ----------
                const setQuality = async () => {
                  for (const frame of page.frames()) {
                    try {
                      const isMgp = await frame.evaluate(() => !!document.querySelector('.mgp_btn-settings'));
                      if (!isMgp) continue;
                      const res = await frame.evaluate(async (q) => {
                        const sleep = ms => new Promise(r => setTimeout(r, ms));
                        const cur = () => ((document.querySelector('.mgp_quality-btn-text') || {}).textContent || '').trim();
                        const items = () => Array.from(document.querySelectorAll('.mgp_settings-menu-quality-item'));
                        const find = () => items().find(it => new RegExp('^\\s*' + q + '(\\D|$)').test((it.textContent || '').trim()));
                        const fire = el => ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']
                          .forEach(t => el.dispatchEvent(new MouseEvent(t, { bubbles: true, cancelable: true, view: window })));
                        if (parseInt(cur(), 10) === q) return { ok: true, cur: cur() };
                        let it = null;
                        const gear = document.querySelector('.mgp_btn-settings');
                        if (gear) {
                          fire(gear); await sleep(800);
                          const row = Array.from(document.querySelectorAll('.mgp_settings-menu-page-row'))
                            .find(r => /quality/i.test((r.querySelector('.mgp_settings-menu-page-row-left') || r).textContent || ''));
                          if (row) { fire(row); await sleep(800); }
                          it = find();
                        }
                        if (!it) {
                          const qb = document.querySelector('.mgp_btn-quality');
                          if (qb) { fire(qb); await sleep(800); }
                          it = find();
                        }
                        if (!it) return { ok: false, cur: cur(), items: items().map(i => (i.textContent || '').trim()) };
                        fire(it.querySelector('.mgp_settings-menu-page-row-right') || it);
                        await sleep(1500);
                        return { ok: parseInt(cur(), 10) === q, cur: cur() };
                      }, QUALITY);
                      console.log('  mgp quality result:', JSON.stringify(res));
                      if (res.ok) return true;
                    } catch (e) {}
                  }
                  return false;
                };

                let picked = false;
                for (let a = 0; a < 6 && !picked; a++) {
                  const has = await Promise.all(page.frames().map(f =>
                    f.evaluate(() => !!document.querySelector('.mgp_btn-settings')).catch(() => false)
                  )).then(r => r.some(Boolean));
                  if (!has) break; // پلیر mgp نیست
                  picked = await setQuality();
                  if (!picked) await page.waitForTimeout(2000);
                }
                if (picked && cands.size > 0) {
                  console.log(`  Clearing ${cands.size} candidate(s) captured before quality selection`);
                  cands.clear();
                }

                const readFromDom = async () => {
                  for (const frame of page.frames()) {
                    try {
                      const base = frame.url() || pageUrl;
                      const vals = await frame.evaluate(() => {
                        const out = [];
                        document.querySelectorAll('video, video source, source').forEach(v => {
                          out.push(v.getAttribute('src'));
                          out.push(v.currentSrc);
                        });
                        document.querySelectorAll('meta[itemprop="contentUrl"], meta[property="og:video"], meta[property="og:video:url"]').forEach(m => out.push(m.content));
                        document.querySelectorAll('a[download]').forEach(a => out.push(a.href));
                        return out.filter(Boolean);
                      });
                      vals.forEach(s => { try { add(new URL(s, base).href, 'dom'); } catch (e) {} });
                    } catch (e) {}
                  }
                };

                const tryPlay = async () => {
                  for (const frame of page.frames()) {
                    try {
                      await frame.evaluate(() => {
                        document.querySelectorAll('video').forEach(v => { v.muted = true; v.play().catch(() => {}); });
                      });
                      for (const sel of ['.mgp_bigPlay', '.mgp_smallPlay', '.vjs-big-play-button', '.jw-icon-display', '.plyr__control--overlaid', '.play-button', '.play', '[class*="play" i]', 'video']) {
                        const el = await frame.$(sel);
                        if (el) await el.click({ timeout: 1500, force: true }).catch(() => {});
                      }
                    } catch (e) {}
                  }
                  await page.mouse.click(640, 360).catch(() => {});
                };

                const trySkipAd = async () => {
                  const sels = [
                    '.videoAdUiSkipButton', '.ytp-ad-skip-button', '.jw-skip', '.jw-skiplink',
                    '.vjs-skip-button', '.skip-button', '.skip_button', '#skip', '.ad-skip', '.adskip',
                    '[class*="skip" i]', '[id*="skip" i]'
                  ];
                  for (const frame of page.frames()) {
                    for (const s of sels) {
                      try {
                        const el = await frame.$(s);
                        if (el && await el.isVisible().catch(() => false)) {
                          console.log('  Clicking skip:', s);
                          await el.click({ timeout: 1500, force: true }).catch(() => {});
                        }
                      } catch (e) {}
                    }
                    try {
                      const byText = frame.getByText(/skip( ad)?|close ad|رد کردن/i).first();
                      if (await byText.isVisible({ timeout: 300 }).catch(() => false)) {
                        console.log('  Clicking skip (text)');
                        await byText.click({ timeout: 1500, force: true }).catch(() => {});
                      }
                    } catch (e) {}
                  }
                };

                await readFromDom();
                await tryPlay();

                const maxWait = 60;
                let lastCount = -1, stable = 0;
                for (let s = 0; s < maxWait; s++) {
                  await page.waitForTimeout(1000);
                  if (s % 3 === 0) await trySkipAd();
                  if (s % 4 === 0) await readFromDom();
                  if (s % 10 === 9) await tryPlay();
                  if (!picked && (s === 10 || s === 25)) { picked = await setQuality(); }

                  if (cands.size > 0) {
                    if (cands.size === lastCount) stable++; else { stable = 0; lastCount = cands.size; }
                    if (s >= 20 && stable >= 12) break;
                  }
                }
                await readFromDom();

                if (cands.size === 0) {
                  for (const frame of page.frames()) {
                    try {
                      const html = (await frame.content()).replace(/\\\//g, '/').replace(/\\u0026/g, '&');
                      const m = html.match(/https?:\/\/[^"'\s<>\\]+\.(?:mp4|m3u8|webm|mkv|mov|m4v|vid)[^"'\s<>\\]*/gi) || [];
                      m.forEach(s => add(s, 'html'));
                    } catch (e) {}
                  }
                }

                if (cands.size === 0) {
                  console.log('  No video URL found.');
                  const text = await page.evaluate(() => document.body ? document.body.innerText.slice(0, 500) : '').catch(() => '');
                  console.log('  Page text start:\n' + text);
                  console.log('  Frames:', page.frames().map(f => f.url()).join(' | '));
                  fs.mkdirSync('debug', { recursive: true });
                  await page.screenshot({ path: `debug/page_${i + 1}.png`, fullPage: true }).catch(() => {});
                  fs.writeFileSync(`debug/page_${i + 1}.html`, await page.content().catch(() => ''));
                  await ctx.close();
                  continue;
                }

                // امتیازدهی کاندیدها
                const list = [];
                for (const [url, info] of cands) {
                  let score = 0;
                  const host = hostOf(url);
                  const h = qualityFromUrl(url);
                  const isSeg = SEG_RE.test(url);

                  if (AD_RE.test(url)) score -= 100;
                  if (host === pageHost || host.endsWith('.' + pageHost.replace(/^www\./, ''))) score += 20;
                  if (isSeg) score -= 200; // قطعه‌ی HLS، فایل مستقل نیست

                  if (h === QUALITY) score += 200;
                  else if (h > 0) score -= Math.min(100, Math.floor(Math.abs(h - QUALITY) / 5));

                  let size = 0, dur = 0;
                  if (info.type === 'file' && !isSeg) {
                    size = await probeSize(ctx, url, pageUrl);
                    if (size >= BIG_SIZE) score += 50;
                    else if (size > 0 && size < 5 * 1024 * 1024) score -= 30;
                    score += Math.min(60, Math.floor(size / (50 * 1024 * 1024)) * 10);
                  } else if (info.type === 'hls') {
                    if (/master\.m3u8/i.test(url)) score += 30; // master همه‌ی کیفیت‌ها را دارد
                  }
                  list.push({ url, ...info, score, size, dur, height: h, isSeg });
                }
                list.sort((a, b) => b.score - a.score || b.size - a.size || b.order - a.order);

                console.log('  --- Candidates (best first) ---');
                list.forEach((c, n) => console.log(`  #${n + 1} score=${c.score} type=${c.type} height=${c.height || '?'} size=${c.size} why=${c.why}\n      ${c.url}`));
                if (!list.some(c => c.height === QUALITY && !c.isSeg)) {
                  console.log(`  WARNING: no ${QUALITY}p candidate found, nearest will be used.`);
                }

                let done = false;
                let k = 0;
                const headers = browserHeaders(pageUrl, await cookieStr());
                for (const c of list) {
                  if (c.isSeg) continue;
                  k++;
                  console.log(`  Downloading #${k} (${c.height || '?'}p):`, c.url);
                  if (c.type === 'file') {
                    const out = path.join('downloads', fileNameFrom(c.url, i + 1, k));
                    if (await downloadDirect(ctx, c.url, pageUrl, out)) { done = true; break; }
                  } else {
                    if (await downloadPlaylist(ctx, c.url, headers, baseName)) { done = true; break; }
                  }
                }

                if (done) success++;
                else console.log('  All candidates failed.');
              } catch (e) {
                console.log('  Error:', e.message);
              }
              await ctx.close();
            }

            await browser.close();
            console.log(`\nSuccess: ${success} / ${urls.length}`);
            process.exit(success > 0 ? 0 : 1);
          })();
          EOF

      - name: Find and download
        id: grab
        continue-on-error: true
        env:
          URLS: ${{ github.event.inputs.urls }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: node grab.js

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Clean empty files
        id: clean
        if: always()
        run: |
          mkdir -p downloads
          find downloads -type f -name '*.tmp.bin' -delete
          find downloads -type f -size -1c -print -delete
          find downloads -type f -size -100k -print -delete
          ls -lh downloads/ || true
          if [ -n "$(find downloads -type f | head -1)" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.clean.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ph2-${{ github.run_number }}
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if nothing downloaded
        if: steps.clean.outputs.has_files != 'true'
        run: |
          echo "No valid file was downloaded."
          exit 1
